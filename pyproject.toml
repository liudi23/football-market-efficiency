[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sportsq"
version = "0.1.0"
description = "Market-anchored football forecasting and betting research"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "requests>=2.31",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]
ml = ["scikit-learn>=1.3", "lightgbm>=4.0"]
extra = ["penaltyblog>=1.6", "soccerdata>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
